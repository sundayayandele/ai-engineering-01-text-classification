[build-system]
requires = ["setuptools>=75","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-01-text-classification"
version = "0.1.0"
description = "Production-oriented NLP text classification reference project"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115","uvicorn[standard]>=0.32","scikit-learn>=1.5","pandas>=2.2","joblib>=1.4","pydantic>=2.9","ucimlrepo>=0.0.7"]

[project.optional-dependencies]
dev = ["pytest>=8.3","httpx>=0.27","ruff>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
