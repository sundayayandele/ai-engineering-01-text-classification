name: manifests

on:
  push:
    paths:
      - "kubernetes/**"
      - "openshift/**"
      - ".github/workflows/manifests.yml"
  pull_request:
    paths:
      - "kubernetes/**"
      - "openshift/**"
      - ".github/workflows/manifests.yml"

permissions:
  contents: read

jobs:
  kubernetes-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render Kubernetes base
        run: kubectl kustomize kubernetes/base > /tmp/kubernetes.yaml
      - name: Assert manifests rendered
        run: test -s /tmp/kubernetes.yaml

  openshift-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Render OpenShift overlay
        run: kubectl kustomize openshift > /tmp/openshift.yaml
      - name: Assert manifests rendered
        run: test -s /tmp/openshift.yaml
